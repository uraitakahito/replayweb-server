# Known-vulnerability gate for pnpm-lock.yaml. Advisories this repository cannot
# fix and that do not reach what it serves are skipped in pnpm-workspace.yaml under
# auditConfig.ignoreGhsas, each next to why it cannot be fixed, why it does not
# reach, and when to remove it. Keeping the exceptions there rather than in a flag
# here means a local `pnpm audit` gives the same answer as this job.
#
# Advisories are published independently of our pull requests, so this also runs
# every day (21:17 UTC). `schedule` and `workflow_dispatch` run the copy of this
# file on the default branch (main).
#
# `pnpm audit` directly rather than through a package script: a direct command
# reads the lockfile without pnpm 11 installing everything first (it does that
# before any `pnpm run`).
name: audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      # The version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      # The version comes from .nvmrc.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Audit the lockfile
        run: pnpm audit --audit-level=low
